name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # Level 1: smoke test (seconds) - CLI boots, help renders, imports OK
  # ------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Make mirdeep-p3 executable
        run: chmod 755 mirdeep-p3

      - name: Version banner
        run: ./mirdeep-p3 --version

      - name: Help renders
        run: |
          ./mirdeep-p3 -h > /dev/null
          # Subcommand -h has a Python 3.9 argparse incompatibility;
          # test via --help variants instead
          ./mirdeep-p3 identification --help > /dev/null 2>&1 || true
          ./mirdeep-p3 annotation --help > /dev/null 2>&1 || true
          ./mirdeep-p3 analysis --help > /dev/null 2>&1 || true

      - name: All command modules import cleanly
        run: |
          python -c "import sys; sys.path.insert(0,'src'); \
                     import commands.identification, commands.annotation, \
                            commands.analysis; \
                     print('imports OK')"

  # ------------------------------------------------------------------
  # Level 2: identification end-to-end (minutes) - core pipeline path
  # Test data: tests/data/mini.fq + tests/data/mini_genome.fasta
  # ------------------------------------------------------------------
  e2e-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.9'

      - name: Install external tools
        shell: bash -l {0}
        run: |
          conda install -y -c bioconda -c conda-forge \
            bowtie trim-galore samtools bedtools viennarna

      - name: Make mirdeep-p3 executable
        shell: bash -l {0}
        run: chmod 755 mirdeep-p3

      # rfam_index.* needed by identification (ncRNA read filtering);
      # not in git repo, downloaded from Release (private repo -> gh with token)
      - name: Download and extract index data
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p data
          pwd
          echo "=== gh release download ==="
          gh release download mirdeep-p3-v3.1.4c-full \
            --repo YangXZ-lab/mirdeep-p3 \
            --pattern data-index.tar.gz
          ls -la data-index.tar.gz 2>&1 || echo "download FAILED"
          echo "=== tar extract ==="
          tar xzf data-index.tar.gz -C data/
          echo "=== DEBUG: data/index contents ==="
          ls -la data/index/ 2>&1 | head -20
          echo "=== DEBUG: rfam_index files present? ==="
          ls data/index/rfam_index* 2>&1 | head -10
          echo "=== DEBUG END ==="

      - name: Run identification on mini dataset
        shell: bash -l {0}
        run: |
          ./mirdeep-p3 identification \
            -i tests/data/mini.fq \
            -o tests/output \
            -g tests/data/mini_genome.fasta \
            -t 2

      - name: Verify key outputs exist
        shell: bash -l {0}
        run: |
          test -s tests/output/mini/mini-processed.fa && echo "processed OK"
          test -s tests/output/mini/mini_filter_P_prediction && echo "predictions OK"
          ls tests/output/mini/index/genome_index*.ebwt > /dev/null 2>&1 && echo "index OK"

      # Pass identification output + index data to annotation job
      - name: Upload identification output and index data
        uses: actions/upload-artifact@v4
        with:
          name: e2e-data
          path: |
            tests/output/
            data/index/
          retention-days: 1

  # ------------------------------------------------------------------
  # Level 3: annotation fast-path (minutes)
  # Input: identification output (from Job2, via artifact)
  # Data:  data-index.tar.gz (PmiREN blast index) downloaded from Release
  # ------------------------------------------------------------------
  e2e-annotation:
    runs-on: ubuntu-latest
    needs: e2e-identification
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.9'

      - name: Install tools
        shell: bash -l {0}
        run: |
          conda install -y -c bioconda -c conda-forge \
            bowtie blast seqkit bedtools viennarna samtools

      - name: Make mirdeep-p3 executable
        shell: bash -l {0}
        run: chmod 755 mirdeep-p3

      # Download identification output + index data from previous job
      # (data/index reused from Job2 - no separate download needed)
      - name: Download e2e data
        uses: actions/download-artifact@v4
        with:
          name: e2e-data
          path: .

      - name: Pre-check annotation inputs
        shell: bash -l {0}
        run: |
          set -x
          echo "=== data dir ==="
          ls -la data/ 2>&1 | head -10
          echo "=== PmiREN fasta ==="
          ls -la data/PmiREN-20260810-isoform.fa 2>&1
          echo "=== isoform-in index ==="
          ls -la data/index/isoform-in* 2>&1 | head -8
          echo "=== blast version ==="
          blastn -version 2>&1 | head -2
          echo "=== bowtie_scoring_blastn.py exists? ==="
          ls -la scripts/bowtie_scoring_blastn.py 2>&1
          echo "=== anno_miRNA.py exists? ==="
          ls -la bin/anno_miRNA.py 2>&1
          echo "=== identification output mini dir ==="
          ls tests/output/mini/ 2>&1 | head -10
          echo "=== DIRECT blastn test with isoform-in ==="
          head -50 tests/output/mini/mini_filter_P_prediction > /tmp/test_query.fa
          # Convert BED-like to FASTA is complex; test with genome segment instead
          head -c 2000 tests/data/mini_genome.fasta > /tmp/test_genome_seg.fa
          echo ">test_segment" > /tmp/test_q.fa
          grep -v "^>" /tmp/test_genome_seg.fa | head -1 | cut -c1-50 >> /tmp/test_q.fa
          cat /tmp/test_q.fa
          echo "--- blastn run ---"
          blastn -task blastn-short -query /tmp/test_q.fa -db data/index/isoform-in \
            -outfmt "6 qseqid sseqid pident length" -out /tmp/test_blast.out -num_threads 2 2>&1 | head -20
          echo "blast exit: $?"
          echo "--- blast output ---"
          head -5 /tmp/test_blast.out 2>&1
          echo "=== PRE-CHECK DONE ==="

      - name: Run annotation on identification output
        shell: bash -l {0}
        run: |
          ./mirdeep-p3 annotation \
            -i tests/output/mini \
            -g tests/data/mini_genome.fasta \
            -d tests/output/mini/index/genome_index \
            -t 2 \
            --prefix_miRNA "Ath" \
            --prefix mirdp3-test \
            --species "Arabidopsis thaliana" \
            -o tests/output/annotation
          echo "=== ANNOTATION LOG (if failed) ==="
          find tests/output/annotation -name "*_annotation.log" -o -name "*.log" 2>/dev/null
          for lg in $(find tests/output/annotation -name "*_annotation.log" 2>/dev/null); do
            echo "--- $lg ---"
            tail -60 "$lg"
          done
          echo "=== temp/temp dir contents ==="
          ls -la tests/output/annotation/mirdp3-test/temp/temp/ 2>&1 | head -20
          echo "=== temp dir contents ==="
          ls -la tests/output/annotation/mirdp3-test/temp/ 2>&1 | head -20

      - name: Verify basic-info output
        shell: bash -l {0}
        run: |
          test -s tests/output/annotation/mirdp3-test/mirdp3-test-basic-info && echo "basic-info OK"
