name: Build and Publish Docker Images

on:
  push:
    tags:
      - "v*-full"
      - "mirdeep-p3-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, e.g. 3.1.5a-full (required when dispatching manually)'
        required: false
        default: ''

env:
  IMAGE_NAME: mirdeep-p3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      # --- Resolve image version ----
      # tag push (v3.1.5a-full) -> VERSION=3.1.5a-full (strip leading v)
      # manual dispatch  -> use the 'version' input (required)
      - name: Resolve image version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.version }}" ]; then
              echo "::error::workflow_dispatch requires the 'version' input (e.g. 3.1.5a-full)"
              exit 1
            fi
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Resolved VERSION=$VER"

      # --- Download data index into build context ----
      # data/index is not in the git repo; fetch the fixed-URL Release asset so
      # the image is self-contained ("-full"). URL stays constant across versions.
      - name: Download data index
        run: |
          mkdir -p data
          curl -sL -o data/data-index.tar.gz \
            https://github.com/YangXZ-lab/mirdeep-p3/releases/download/mirdeep-p3-v3.1.4c-full/data-index.tar.gz
          tar xzf data-index.tar.gz -C data/
          ls data/index/ | head -5

      # --- Free disk space (runner ships with Android/.NET/Swift preinstalled) ---
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache conda layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # --- Docker Hub login ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Compute lowercase repo owner for GHCR tag ---
      - name: Set lowercase owner
        run: echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # --- GHCR login（using GitHub） ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build and push two registry ---
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LOWER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      # --- Generate tar.gz（GitHub Release download） ---
      - name: Save image as tar.gz
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} | gzip > ${{ env.IMAGE_NAME }}-${{ env.VERSION }}.tar.gz
          ls -lh ${{ env.IMAGE_NAME }}-${{ env.VERSION }}.tar.gz

      # --- Upload to GitHub Release ---
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IMAGE_NAME }}-${{ env.VERSION }}.tar.gz
          generate_release_notes: true
