name: Build and Publish Docker Images

on:
  push:
    tags:
      - "v*-full"
      - "mirdeep-p3-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, e.g. 3.1.6c-full (required when dispatching manually)'
        required: false
        default: ''

env:
  IMAGE_NAME: mirdeep-p3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      # --- Resolve image version ----
      # tag push (v3.1.6c-full) -> VERSION=3.1.6c-full (strip leading v)
      # manual dispatch  -> use the 'version' input (required)
      - name: Resolve image version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.version }}" ]; then
              echo "::error::workflow_dispatch requires the 'version' input (e.g. 3.1.6c-full)"
              exit 1
            fi
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Resolved VERSION=$VER"

      # --- Free disk space FIRST (runner ships with Android/.NET/Swift preinstalled) ---
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # --- Download data index into build context ----
      # data/index is not in the git repo; fetch the Release asset recorded in
      # data-index.env so the image is self-contained ("-full").  That tag is
      # deliberately independent of the software version: updating the index means
      # editing data-index.env, not cutting a new software release.
      # gh CLI is pre-authenticated and retries; explicit size check before untar.
      - name: Download data index
        run: |
          mkdir -p data
          DATA_INDEX_RELEASE="$(sed -n 's/^DATA_INDEX_RELEASE=//p' data-index.env | head -1 | tr -d '[:space:]')"
          test -n "$DATA_INDEX_RELEASE" || { echo "::error::DATA_INDEX_RELEASE is not set in data-index.env"; exit 1; }
          echo "Downloading data index from release: $DATA_INDEX_RELEASE"
          gh release download "$DATA_INDEX_RELEASE" \
            --repo "${{ github.repository }}" \
            --pattern data-index.tar.gz \
            --dir data --clobber
          test -s data/data-index.tar.gz || { echo "::error::data-index.tar.gz download failed or empty"; exit 1; }
          tar xzf data/data-index.tar.gz -C data/
          rm -f data/data-index.tar.gz
          ls data/index/ | head -5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache conda layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # --- Docker Hub login ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Compute lowercase repo owner for GHCR tag ---
      - name: Set lowercase owner
        run: echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # --- GHCR login (using GitHub) ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build and push two registry ---
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LOWER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      # --- Generate tar.gz (GitHub Release download) ---
      - name: Save image as tar.gz
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} | gzip > ${{ env.IMAGE_NAME }}-${{ env.VERSION }}.tar.gz
          ls -lh ${{ env.IMAGE_NAME }}-${{ env.VERSION }}.tar.gz

      # --- Upload to GitHub Release ---
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IMAGE_NAME }}-${{ env.VERSION }}.tar.gz
          generate_release_notes: true
