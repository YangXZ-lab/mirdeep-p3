name: mirdp3
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # ---- Python core ----
  - python=3.12.*
  - biopython>=1.81
  - numpy>=1.26
  - pyyaml>=6.0
  - openpyxl>=3.0
  - xlsxwriter>=3.0

  # ---- Alignment / mapping (version-sensitive, pinned) ----
  - bowtie=1.3.1          # v1.3.1 tested; do NOT use bowtie2 here
  - bowtie2>=2.5
  - samtools>=1.17
  - bedtools>=2.30
  - seqkit>=2.4
  - viennarna=2.7.*       # RNAfold; output format sensitive
  - trim-galore>=0.6.7

  # ---- Annotation / homology ----
  - blast>=2.13
  - hmmer>=3.3
  - fasta3>=36.3.8        # ssearch
  - mmseqs2>=14
  - diamond>=2.0
  - eggnog-mapper>=2.1
  - meme>=5.4             # FIMO (TFBS)
  - prodigal>=2.6
  - gffread>=0.12

  # ---- R base & plotting ----
  - r-base>=4.2
  - r-ggplot2>=3.4
  - r-dplyr>=1.0
  - r-tidyr>=1.2
  - r-stringr>=1.4
  - r-scales>=1.2
  - r-optparse>=1.7
  - r-patchwork>=1.1
  - r-gridextra>=2.3
  - r-viridis>=0.6
  - r-circlize>=0.4.14
  - r-svglite>=2.1
  - r-ggrepel>=0.9
  - r-ggraph>=2.1
  - r-igraph>=1.5
  - r-data.table>=1.14
  - r-openxlsx>=4.2
  - r-jsonlite>=1.8
  - r-ape>=5.7

  # ---- Bioconductor (functional analysis) ----
  - bioconductor-clusterprofiler>=4.10
  - bioconductor-complexheatmap>=2.18
  - bioconductor-deseq2>=1.42
  - bioconductor-apeglm>=1.24
  - bioconductor-enrichplot>=1.22
  - bioconductor-gosemsim>=2.28
  - bioconductor-dose>=3.28
  - bioconductor-annotationforge>=1.44
  - bioconductor-ggtree>=3.10
  - bioconductor-biostrings>=2.70
  - bioconductor-genomicranges>=1.54
  - bioconductor-iranges>=2.36
  - bioconductor-go.db>=3.18
  - bioconductor-keggrest>=1.42
